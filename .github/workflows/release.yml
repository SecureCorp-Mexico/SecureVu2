name: On release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: lowercaseRepo
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}
      - name: Log in to the Container registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tag variables
        env:
          TAG: ${{ github.ref_name }}
          LOWERCASE_REPO: ${{ steps.lowercaseRepo.outputs.lowercase }}
        run: |
          BUILD_TYPE=$([[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo "stable" || echo "beta")
          echo "BUILD_TYPE=${BUILD_TYPE}" >> $GITHUB_ENV
          echo "BASE=ghcr.io/${LOWERCASE_REPO}" >> $GITHUB_ENV
          echo "BUILD_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$(echo ${GITHUB_REF##*/} | tr '[:upper:]' '[:lower:]' | sed 's/^[v]//')" >> $GITHUB_ENV
      - name: Tag and push the main image
        run: |
          VERSION_TAG=${BASE}:${CLEAN_VERSION}
          STABLE_TAG=${BASE}:stable
          PULL_TAG=${BASE}:${BUILD_TAG}
          VARIANTS="standard-arm64 tensorrt tensorrt-jp6 rk rocm synaptics"

          copy() {
            docker run --rm -v $HOME/.docker/config.json:/config.json quay.io/skopeo/stable:latest copy --authfile /config.json --multi-arch all "docker://$1" "docker://$2"
          }

          # The default (standard multi-arch) image is the critical artifact: if it fails
          # to promote, the release must fail. Promote it (and stable) first so a later
          # variant hiccup can never leave the standard release/stable tag unset.
          copy "${PULL_TAG}" "${VERSION_TAG}"
          if [[ "${BUILD_TYPE}" == "stable" ]]; then
            copy "${PULL_TAG}" "${STABLE_TAG}"
          fi

          # Hardware variants are best-effort: a single transient or missing variant build
          # (e.g. a runner ENOSPC flake) must not block promotion of the standard image.
          # Failures are surfaced as warnings and collected instead of aborting the job.
          failed=""
          for variant in ${VARIANTS}; do
            if ! copy "${PULL_TAG}-${variant}" "${VERSION_TAG}-${variant}"; then
              echo "::warning::failed to promote ${VERSION_TAG}-${variant}"
              failed="${failed} ${variant}"
              continue
            fi
            if [[ "${BUILD_TYPE}" == "stable" ]]; then
              if ! copy "${PULL_TAG}-${variant}" "${STABLE_TAG}-${variant}"; then
                echo "::warning::failed to promote ${STABLE_TAG}-${variant}"
                failed="${failed} ${variant}"
              fi
            fi
          done

          if [[ -n "${failed}" ]]; then
            echo "::warning::variant promotion incomplete for:${failed} — standard image (${VERSION_TAG}$([[ "${BUILD_TYPE}" == "stable" ]] && echo " + ${STABLE_TAG}")) promoted successfully"
          fi
