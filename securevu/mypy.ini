[mypy]
python_version = 3.11
show_error_codes = true
follow_imports = normal
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ignore-without-code
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
# https://github.com/python/mypy/issues/10757
disallow_untyped_calls = false
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true

[mypy-securevu.*]
ignore_errors = false

# Third-party code imported from https://github.com/ufal/whisper_streaming
[mypy-securevu.data_processing.real_time.whisper_online]
ignore_errors = true

# TODO: Remove ignores for these modules as they are updated with type annotations.

[mypy-securevu.api.*]
ignore_errors = true

[mypy-securevu.config.*]
ignore_errors = true

[mypy-securevu.debug_replay]
ignore_errors = true

[mypy-securevu.detectors.*]
ignore_errors = true

[mypy-securevu.embeddings.*]
ignore_errors = true

[mypy-securevu.http]
ignore_errors = true

[mypy-securevu.ptz.*]
ignore_errors = true

[mypy-securevu.stats.*]
ignore_errors = true

[mypy-securevu.test.*]
ignore_errors = true

[mypy-securevu.util.*]
ignore_errors = true

[mypy-secure.vu.*]
ignore_errors = true
